<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>유한대학교 교내봉사 근로부서 예산관리 시스템 (2학기 전용)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f8fafc}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
</style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

<!-- TOAST ALERTS -->
<div id="toast" class="fixed bottom-5 right-5 z-50 transition-all duration-300 translate-y-20 opacity-0 bg-slate-900 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3">
  <i id="toast-icon" class="fas fa-info-circle text-blue-400"></i><span id="toast-msg" class="text-sm font-medium"></span>
</div>

<!-- HEADER -->
<header class="bg-slate-900 text-white sticky top-0 z-40 shadow-md">
  <div class="max-w-7xl mx-auto px-4 flex items-center justify-between h-16">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center"><i class="fas fa-university"></i></div>
      <div><h1 class="font-bold text-lg leading-tight">유한대학교 교내봉사 근로부서 예산관리</h1><p class="text-xs text-slate-400">2학기 근로 예산 및 잔액 관리</p></div>
    </div>
    <div class="flex items-center gap-3">
      <div id="user-badge" class="hidden sm:flex items-center gap-2 bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-lg text-xs text-slate-300">
        <span id="role-pill" class="px-2 py-0.5 rounded text-[10px] font-semibold"></span><span id="user-display-name"></span>
      </div>
      <button id="logout-btn" onclick="logout()" class="hidden bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg text-xs font-semibold border border-slate-700"><i class="fas fa-sign-out-alt mr-1"></i>로그아웃</button>
    </div>
  </div>
</header>

<main class="flex-grow max-w-7xl w-full mx-auto px-4 py-8">

<!-- LOGIN SECTION -->
<div id="login-section" class="max-w-md mx-auto my-12 bg-white rounded-2xl shadow-xl border border-slate-200 p-8">
  <div class="text-center mb-8">
    <div class="w-16 h-16 bg-blue-50 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-blue-100"><i class="fas fa-user-shield text-blue-600 text-2xl"></i></div>
    <h2 class="text-2xl font-bold">시스템 로그인</h2>
    <p class="text-sm text-slate-500 mt-1">담당 학과 또는 관리자 권한을 선택하세요.</p>
  </div>
  <div class="grid grid-cols-2 gap-1 p-1 bg-slate-100 rounded-xl mb-6 text-sm font-semibold">
    <button type="button" id="tab-dept-btn" onclick="switchLoginTab('dept')" class="py-2.5 rounded-lg bg-white text-blue-600 shadow-sm">학과 담당자</button>
    <button type="button" id="tab-admin-btn" onclick="switchLoginTab('admin')" class="py-2.5 rounded-lg text-slate-600">총괄 관리자</button>
  </div>
  <form id="dept-login-form" onsubmit="handleDeptLogin(event)" class="space-y-4">
    <div><label class="block text-xs font-semibold text-slate-600 mb-1.5">소속 학과 선택</label>
      <select id="login-dept-select" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm bg-slate-50"></select></div>
    <div><label class="block text-xs font-semibold text-slate-600 mb-1.5">비밀번호</label>
      <input type="password" id="login-dept-pw" required placeholder="비밀번호: 1234" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm"></div>
    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl text-sm"><i class="fas fa-sign-in-alt mr-1"></i>학과 로그인</button>
  </form>
  <form id="admin-login-form" onsubmit="handleAdminLogin(event)" class="space-y-4 hidden">
    <div><label class="block text-xs font-semibold text-slate-600 mb-1.5">관리자 아이디</label>
      <input type="text" id="login-admin-id" value="admin" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm bg-slate-50"></div>
    <div><label class="block text-xs font-semibold text-slate-600 mb-1.5">관리자 비밀번호</label>
      <input type="password" id="login-admin-pw" required placeholder="비밀번호: admin1234 또는 admin" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm"></div>
    <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-3 rounded-xl text-sm"><i class="fas fa-lock mr-1"></i>관리자 로그인</button>
  </form>
  <p class="mt-6 pt-4 border-t border-slate-100 text-center text-xs text-slate-400">* 학과 비밀번호: <span class="font-mono text-slate-600">1234</span> | 관리자: <span class="font-mono text-slate-600">admin / admin1234</span></p>
</div>

<!-- DASHBOARD SECTION -->
<div id="dashboard-section" class="hidden space-y-6">
  <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-wrap items-center justify-between gap-4">
    <div class="flex flex-wrap items-center gap-3">
      <div class="flex items-center gap-2 bg-slate-50 border border-slate-300 rounded-xl px-3 py-1.5 text-xs">
        <i class="fas fa-graduation-cap text-slate-500"></i><span class="font-semibold text-slate-600">학년도:</span>
        <select id="global-year-select" onchange="changeYear(this.value)" class="bg-transparent font-bold focus:outline-none">
          <option value="2026">2026학년도</option><option value="2027">2027학년도</option></select></div>
      <div class="flex items-center gap-2 bg-slate-100 border border-slate-300 rounded-xl px-3 py-1.5 text-xs">
        <i class="fas fa-bookmark text-blue-600"></i><span class="font-bold text-slate-700">2학기 (9월~2월)</span></div>
      <div class="flex items-center gap-2 bg-blue-50 border border-blue-200 rounded-xl px-3 py-1.5 text-xs">
        <i class="far fa-calendar-alt text-blue-600"></i><span class="font-bold text-blue-900">근무 월:</span>
        <select id="global-month-select" onchange="changeMonth(this.value)" class="bg-transparent text-blue-900 font-bold focus:outline-none">
          <option value="9월">9월</option><option value="10월">10월</option><option value="11월">11월</option>
          <option value="12월">12월</option><option value="1월">1월</option><option value="2월">2월</option>
        </select></div>
    </div>
    <div class="flex items-center gap-3 text-xs">
      <span class="text-slate-500">기준 시급: <strong id="global-hourly-wage-display" class="text-slate-800">10,320원</strong></span>
      <button onclick="resetDataConfirmation()" class="text-rose-600 hover:bg-rose-50 px-2.5 py-1.5 rounded-lg border border-rose-200"><i class="fas fa-undo-alt mr-1"></i>데이터 초기화</button>
    </div>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200"><span class="text-xs font-bold text-slate-500">2학기 배정예산 (C열)</span>
      <div id="stat-total-budget" class="text-2xl font-extrabold mt-2">0 원</div></div>
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200"><span class="text-xs font-bold text-blue-600"><span class="mon-t">9월</span> 나갈 금액 (F열)</span>
      <div id="stat-monthly-pay" class="text-2xl font-extrabold text-blue-600 mt-2">0 원</div></div>
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200"><span class
